[project]
name = "aureon-ml"
version = "0.1.0"
description = "Aureon — Machine learning pipelines and models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
torch = ["torch>=2.3.0"]
tracking = ["mlflow>=2.14.0"]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
